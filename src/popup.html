<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frame Color</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">Frame Color</div>
  <button type="button" id="autoBtn" class="auto-btn active" title="Automatically detect the app's Light/Dark and Default/Strong contrast theme">
    Auto (Match App Theme)
  </button>
  <div class="picker-row">
    <input type="color" id="colorPicker" value="#fafafa" aria-label="Color Picker">
    <input type="text" id="hexInput" value="#fafafa" maxlength="7" spellcheck="false" aria-label="Hex Color">
  </div>
  <div class="swatches">
    <button type="button" class="swatch" data-color="#fafafa" title="Light — Default Contrast (250, 250, 250 / #fafafa)">
      <span class="dot" style="background:#fafafa"></span>Light
    </button>
    <button type="button" class="swatch" data-color="#f3f3f3" title="Light — Strong Contrast (243, 243, 243 / #f3f3f3)">
      <span class="dot" style="background:#f3f3f3"></span>Light HC
    </button>
    <button type="button" class="swatch" data-color="#111114" title="Dark — Default Contrast (17, 17, 20 / #111114)">
      <span class="dot" style="background:#111114"></span>Dark
    </button>
    <button type="button" class="swatch" data-color="#121216" title="Dark — Strong Contrast (18, 18, 22 / #121216)">
      <span class="dot" style="background:#121216"></span>Dark HC
    </button>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
